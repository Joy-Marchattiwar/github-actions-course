name: Label PR when approved

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-when-approved:
    runs-on: ubuntu-latest

    steps:
      - name: Debug event
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Review State: ${{ github.event.review.state }}"
          echo "Reviewer: ${{ github.event.review.user.login }}"
          echo "PR Author: ${{ github.event.pull_request.user.login }}"

      - name: Add approved label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            console.log("Review State:", context.payload.review.state);

            // Exit if review is not APPROVED
            if (context.payload.review.state.toLowerCase() !== "approved") {
              console.log("Review is not approved.");
              return;
            }

            // Get all reviews
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number
              }
            );

            // Count only the latest review from each reviewer
            const latestReviews = new Map();

            for (const review of reviews) {
              latestReviews.set(review.user.login, review.state);
            }

            const approvals = [...latestReviews.values()]
              .filter(state => state === "APPROVED")
              .length;

            console.log(`Total approvals: ${approvals}`);

            if (approvals < 1) {
              console.log("Not enough approvals.");
              return;
            }

            // Get current labels
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: pull_number
            });

            const labels = issue.labels.map(l => l.name);

            // Add approved label if missing
            if (!labels.includes("approved")) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: ["approved"]
              });

              console.log("Added 'approved' label.");
            }

            // Remove awaiting review label if present
            if (labels.includes("awaiting review")) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pull_number,
                name: "awaiting review"
              });

              console.log("Removed 'awaiting review' label.");
            }

            console.log("Workflow completed.");
