# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# FIXED: Global env moved to the root level
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # FIXED: Upgraded to v4

      # FIXED: Combined name and run syntax
      - name: NPM install and build
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@master
        with:
          name: webpack artifacts
          path: public/

  test:
    needs: build # Recommended: Wait for the build job to pass before running tests
    runs-on: ${{ matrix.os }} # FIXED: Uses the matrix OS instead of hardcoded ubuntu
  
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        os: [ubuntu-latest, windows-latest] # FIXED: Replaced deprecated windows-2016

    steps:
    - uses: actions/checkout@v4
       
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: NPM install and test
      run: |
        npm install
        npm test
      env:
        CI: true
